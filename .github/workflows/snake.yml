name: Gerar grid de contribuições real

on:
  schedule:
    - cron: "0 3 * * *"   # roda 1x por dia
  workflow_dispatch:        # permite rodar manualmente também

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar SVG a partir dos dados reais do GitHub
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: DaviLGS
          outputs: |
            dist/grid.svg
            dist/grid-dark.svg?palette=github-dark

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
